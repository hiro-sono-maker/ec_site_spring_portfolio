<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>会員登録</title>
    <link rel="stylesheet" th:href="@{/style.css}">
  </head>
  <body>
    <h1>会員登録</h1>

    <form action="/register"
          method="post">
      <div>
        ログイン ID
        <input type="text"
              name="loginId">
      </div>

      <br>
      <div>
        パスワード
        <input type="password"
              name="password">
      </div>
      <br>
      <div>
        氏名
        <input type="text"
               name="userName">
      </div>
      <br>
      <button type="submit">
        登録
      </button>
    </from>
  </body>

</html>
