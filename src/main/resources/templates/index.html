<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">



<head>

  <meta charset="UTF-8">

  <title>商品一覧</title>

  <link rel="stylesheet" th:href="@{/style.css}">

</head>



<body>



  <div class="header">

    <div th:if="${loginUser != null}">

      ようこそ <span th:text="${loginUser.userName}"></span> さん

      <a href="/mypage">
        <button class="amazon-button">
          マイページ
        </button></a>

      <a href="/cart">
        <button class="amazon-button">
        🛒 カート(<span th:text="${cartCount}">0</span>)
        </button>
      </a>

      <a href="/admin/login">
        <button class="amazon-button">
          管理者ログイン
        </button></a>

      <a href="/logout">
        <button class="amazon-button">
          ログアウト
        </button></a>

    </div>



    <div th:if="${loginUser == null}">

      ゲストで利用中

      <a href="/login">
        <button class="amazon-button">
          ログイン
        </button></a>

      <a href="/register">
        <button class="amazon-button">
          会員登録
        </button></a>
      <a href="/cart">
        <button class="amazon-button">
        🛒 カート(<span th:text="${cartCount}">0</span>)
        </button>
      </a>

      <a href="/admin/login">
        <button class="amazon-button">
          管理者ログイン
        </button></a>

    </div>

  </div>



  <h1>商品一覧</h1>



  <form action="/EC" method="get">

    商品名検索：

    <input type="text" name="keyword" th:value="${keyword}">

    <button type="submit">検索</button>

  </form>

<a href="/EC">
  🔄 全商品表示
</a>

  <br>



  <div class="product-list">

    <div class="product-card" th:each="product : ${products}">

      <img th:src="@{/image/{id}(id=${product.productId})}" width="200">

      <h3 th:text="${product.productName}">商品名</h3>

      <p class="price">
        ¥<span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}"></span>

      <p class="stock">
        在庫：<span th:text="${product.stock}">0</span>
      </p>

      <form action="/cart/add" method="post">
        <input type="hidden" name="productId" th:value="${product.productId}">
        <button type="submit" class="amazon-button">
          カート追加
        </button>
      </form>

    </div>

  </div>


</body>



</html>
